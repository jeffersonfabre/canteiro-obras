<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#16202f;--mut:#6b7385;--line:#e4e7ee;--nav:#13203a;--nav2:#1c2c4c;--acc:#f28c28;--acc2:#fff3e6;--blue:#2563eb;--ok:#16a34a;--okb:#e8f7ee;--bad:#dc2626;--badb:#fdecec;--warn:#d97706;--warnb:#fff6e0;--r:12px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{width:232px;background:var(--nav);color:#cdd5e5;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.3px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center}
.brand small{display:block;font-weight:500;font-size:11px;color:#8d9ab5;letter-spacing:0}
.navg{padding:8px 12px 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6f7d9b;font-weight:700;margin-top:6px}
aside a{display:flex;align-items:center;gap:10px;padding:8px 18px;margin:1px 8px;border-radius:8px;color:#cdd5e5;text-decoration:none;cursor:pointer;font-weight:500}
aside a:hover{background:var(--nav2)}aside a.on{background:var(--acc);color:#fff}
aside a span.i{width:18px;text-align:center}
.credit{margin-top:auto;padding:14px 18px;font-size:11px;color:#7d8aa6;border-top:1px solid #22314f}
.credit b{color:#fff}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;letter-spacing:-.3px}
.ham{display:none;border:0;background:none;font-size:22px;cursor:pointer}
.content{padding:22px 26px 60px}
select.obrasel{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:600;max-width:260px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#c9cfdb}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{filter:brightness(.95)}
.btn.b{background:var(--blue);border-color:var(--blue);color:#fff}.btn.d{color:var(--bad)}.btn.s{padding:4px 9px;font-size:12.5px;border-radius:7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{color:var(--mut);font-size:12px;font-weight:600}.kpi .v{font-size:21px;font-weight:800;margin-top:4px;letter-spacing:-.4px}.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;background:#fafbfc}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.sub td{background:#f7f8fb;font-weight:700}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:#eef0f4;color:#4a5263}
.badge.ok{background:var(--okb);color:var(--ok)}.badge.bad{background:var(--badb);color:var(--bad)}.badge.warn{background:var(--warnb);color:var(--warn)}.badge.blue{background:#e8efff;color:var(--blue)}.badge.acc{background:var(--acc2);color:#c26412}
.bar{height:8px;background:#eceef3;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
/* gantt */
.gantt{position:relative}.grow{display:grid;grid-template-columns:220px 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:40px}
.gtrack{position:relative;height:40px}.gbar{position:absolute;top:11px;height:18px;border-radius:5px;background:#d8deea;overflow:hidden;cursor:pointer}
.gbar i{display:block;height:100%;background:var(--acc)}.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.ghead{display:grid;grid-template-columns:220px 1fr;font-size:11px;color:var(--mut);font-weight:600}
.gmonths{position:relative;height:22px}.gmonths span{position:absolute;top:3px;border-left:1px solid var(--line);padding-left:4px}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:#eceff4;border-radius:var(--r);padding:12px;min-height:200px}
.col h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.tk b{display:block;margin-bottom:4px}
.tk.late{border-left:4px solid var(--bad)}
/* rdo */
.rdo{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rdoc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}.rdoc:hover{border-color:var(--acc)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.thumbs.big img{width:150px;height:110px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,22,38,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow:auto}
.ov.on{display:flex}.mod{background:#fff;border-radius:14px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mod.w{width:900px}.mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex}
.mb{padding:18px 20px;max-height:70vh;overflow:auto}.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:5px}.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--mut)}
.f input,.f select,.f textarea,td input,td select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.f textarea{min-height:70px;resize:vertical}td input{padding:5px 8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:20px;cursor:pointer;font-weight:600}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.best{background:var(--okb)!important;color:var(--ok);font-weight:700}
.portal{max-width:960px;margin:0 auto}.phero{background:linear-gradient(135deg,var(--nav),#29457a);color:#fff;border-radius:16px;padding:26px;margin-bottom:16px}
.phero h2{margin:0 0 4px;font-size:24px}.ring{width:110px;height:110px}
.hero0{background:linear-gradient(135deg,var(--nav),#29457a);color:#fff;border-radius:16px;padding:28px;margin-bottom:16px}
.auth{position:fixed;inset:0;background:linear-gradient(135deg,var(--nav),#29457a);display:flex;align-items:center;justify-content:center;padding:20px;z-index:45}.auth.off{display:none}
.authc{background:#fff;border-radius:16px;padding:28px;width:380px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}.authc .f{margin-bottom:12px}.authc .btn{width:100%;margin-top:6px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.usr{font-size:12px;color:var(--mut);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:900px){.usr{display:none}.top{flex-wrap:wrap;gap:8px 10px}.top h1{font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}select.obrasel{order:5;flex-basis:100%;max-width:none}#sync{font-size:10.5px}}
@media(max-width:900px){aside{position:fixed;left:-260px;z-index:40;transition:.2s}aside.on{left:0}.ham{display:block}.grid2,.kan{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.content{padding:16px}.top{padding:12px 16px}.grow,.ghead{grid-template-columns:120px 1fr}}

function toRecords(){const out={};COLS.forEach(c=>S[c].forEach(o=>out[o.id]={id:o.id,colecao:c,obra_id:c=='obras'?o.id:(o.obraId||null),dados:o}));Object.entries(S.estMin).forEach(([k,v])=>{const id='estmin|'+k;out[id]={id,colecao:'estmin',obra_id:k.split('|')[0],dados:{k,v}}});return out}
function setSync(s){const el=$('#sync');if(!el)return;el.className='badge '+({ok:'ok',busy:'warn',erro:'bad'}[s]||'');el.textContent={ok:'● salvo',busy:'● salvando…',erro:'● erro ao salvar'}[s]}
async function pull(){const rows=[];for(let f=0;;f+=1000){const{data,error}=await sb.from('o360_registros').select('id,colecao,dados').order('id').range(f,f+999);if(error)throw error;rows.push(...data);if(data.length<1000)break}
 S=EMPTY();SNAP={};rows.forEach(r=>{SNAP[r.id]=stable(r.dados);if(r.colecao=='estmin')S.estMin[r.dados.k]=r.dados.v;else if(S[r.colecao])S[r.colecao].push(r.dados)})}
const fotosDe=j=>{try{return (JSON.parse(j).fotos||[]).filter(f=>f.startsWith('sb:')).map(f=>f.slice(3))}catch(e){return[]}};
async function uploadFotos(){for(const r of S.rdos){if(!r.fotos)continue;for(let i=0;i<r.fotos.length;i++){const f=r.fotos[i];if(!f.startsWith('data:'))continue;
 const blob=await (await fetch(f)).blob();const path=`${r.obraId}/${r.id}/${uid()}.jpg`;const{error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;URLC[path]=f;r.fotos[i]='sb:'+path}}}
let syncing=false,again=false;
async function sync(){if(!ME)return;if(syncing){again=true;return}syncing=true;
 if(PAPEL=='leitor'){toast('Seu acesso é somente leitura — alteração não salva');try{await pull()}catch(e){}syncing=false;render();return}
 setSync('busy');
 try{await uploadFotos();const cur=toRecords();const ups=[],js=[],dels=[],rm=[];
  for(const id in cur){const j=stable(cur[id].dados);if(SNAP[id]!==j){ups.push(cur[id]);js.push(j);if(cur[id].colecao=='rdos'&&SNAP[id]){const nw=fotosDe(j);rm.push(...fotosDe(SNAP[id]).filter(x=>!nw.includes(x)))}}}
  for(const id in SNAP)if(!cur[id]){dels.push(id);rm.push(...fotosDe(SNAP[id]))}
  for(let i=0;i<ups.length;i+=300){const{error}=await sb.from('o360_registros').upsert(ups.slice(i,i+300));if(error)throw error}
  for(let i=0;i<dels.length;i+=300){const{error}=await sb.from('o360_registros').delete().in('id',dels.slice(i,i+300));if(error)throw error}
  ups.forEach((r,i)=>SNAP[r.id]=js[i]);dels.forEach(id=>delete SNAP[id]);
  if(rm.length)sb.storage.from(BUCKET).remove(rm);
  setSync('ok')}catch(e){setSync('erro');toast('Erro ao salvar: '+(e.message||e))}
 syncing=false;if(again){again=false;sync()}}
function applyRemote(p){const isDel=p.eventType=='DELETE';const row=isDel?p.old:p.new;const id=row.id;
 if(isDel){if(!(id in SNAP))return;delete SNAP[id];if(id.startsWith('estmin|'))delete S.estMin[id.slice(7)];else COLS.forEach(c=>S[c]=S[c].filter(x=>x.id!=id))}
 else{const j=stable(row.dados);if(SNAP[id]===j)return;SNAP[id]=j;if(row.colecao=='estmin')S.estMin[row.dados.k]=row.dados.v;else{const L=S[row.colecao];const k=L.findIndex(x=>x.id==id);if(k>=0)L[k]=row.dados;else L.push(row.dados)}}
 if($('#ov').classList.contains('on'))PEND=true;else render()}
function subscribe(){if(CHAN)sb.removeChannel(CHAN);CHAN=sb.channel('obra360').on('postgres_changes',{event:'*',schema:'public',table:'o360_registros'},applyRemote).subscribe()}

 <div class="card tw" style="padding:0">${S.obras.length?`<table><tr><th>Obra</th><th>Cliente</th><th>Período</th><th>Status</th><th class="n">Orçamento</th><th>Físico</th><th></th></tr>${S.obras.map(o=>{const pf=progFisico(o.id);return `<tr><td><b>${esc(o.nome)}</b><div class="mut" style="font-size:12px">${esc(o.endereco||'')}</div></td><td>${esc(o.cliente)}</td><td>${fd(o.inicio)} → ${fd(o.fim)}</td><td><span class="badge ${STAT[o.status]}">${STL[o.status]}</span></td><td class="n">${brl(precoObra(o))}</td><td style="width:120px"><div class="bar"><i style="width:${pf}%"></i></div><span style="font-size:11.5px" class="mut">${pct(pf)}</span></td><td class="n"><button class="btn s" onclick="setObra('${o.id}');go('orcamento')">Abrir</button> <button class="btn s" onclick="crud('obras',FO,S.obras.find(x=>x.id=='${o.id}'),'obra')">Editar</button> <button class="btn s d" onclick="delObra('${o.id}')">✕</button></td></tr>`}).join('')}</table>`:'<div class="empty">Nenhuma obra ainda.</div>'}</div>`};

V.orcamento=()=>{const o=obra();CUR=o.id;const et=etapasObra(o.id);const cd=custoObra(o.id),bdi=cd*(+o.bdi||0)/100;
 $('#view').innerHTML=`<div class="kpis"><div class="kpi"><div class="l">Custo direto</div><div class="v">${brl(cd)}</div></div><div class="kpi"><div class="l">BDI (${num(o.bdi,1)}%)</div><div class="v">${brl(bdi)}</div></div><div class="kpi"><div class="l">Preço de venda</div><div class="v" style="color:var(--acc)">${brl(cd+bdi)}</div></div><div class="kpi"><div class="l">Etapas / itens</div><div class="v">${et.length} / ${itensObra(o.id).length}</div></div></div>
 <div class="row" style="margin-bottom:12px"><button class="btn" onclick="crud('etapas',FE,null,'etapa',{obraId:CUR,inicio:obra().inicio,fim:obra().fim})">+ Etapa</button><button class="btn p" onclick="${et.length?`crud('itens',FI(),null,'item',{obraId:CUR})`:`toast('Crie uma etapa antes')`}">+ Item</button><span class="sp"></span><button class="btn" onclick="crud('obras',FO,obra(),'obra')">Ajustar BDI</button></div>
 <div class="card tw" style="padding:0">${et.length?`<table><tr><th>Descrição</th><th>Tipo</th><th>Un</th><th class="n">Qtd</th><th class="n">Preço unit.</th><th class="n">Total</th><th class="n">%</th><th></th></tr>${et.map((e,ix)=>{const it=S.itens.filter(i=>i.etapaId==e.id),ce=custoEtapa(e.id);return `<tr class="sub"><td colspan="5">${ix+1}. ${esc(e.nome)}</td><td class="n">${brl(ce)}</td><td class="n">${cd?pct(ce/cd*100):''}</td><td class="n"><button class="btn s" onclick="crud('etapas',FE,S.etapas.find(x=>x.id=='${e.id}'),'etapa')">Editar</button> <button class="btn s d" onclick="del('etapas','${e.id}',()=>S.itens=S.itens.filter(i=>i.etapaId!='${e.id}'))">✕</button></td></tr>`+it.map((i,j)=>`<tr><td style="padding-left:24px">${ix+1}.${j+1} ${esc(i.desc)}</td><td><span class="badge">${i.tipo}</span></td><td>${esc(i.un)}</td><td class="n">${num(i.qtd)}</td><td class="n">${brl(i.preco)}</td><td class="n">${brl(i.qtd*i.preco)}</td><td class="n mut">${cd?pct(i.qtd*i.preco/cd*100):''}</td><td class="n"><button class="btn s" onclick="crud('itens',FI(),S.itens.find(x=>x.id=='${i.id}'),'item')">Editar</button> <button class="btn s d" onclick="del('itens','${i.id}')">✕</button></td></tr>`).join('')}).join('')}<tr class="sub"><td colspan="5">CUSTO DIRETO</td><td class="n">${brl(cd)}</td><td></td><td></td></tr><tr class="sub"><td colspan="5">PREÇO TOTAL COM BDI</td><td class="n" style="color:var(--acc)">${brl(cd+bdi)}</td><td></td><td></td></tr></table>`:'<div class="empty">Comece criando as etapas da obra (ex.: Fundação, Estrutura, Alvenaria…).</div>'}</div>`};

/* ---------- CURVA ABC ---------- */
V.abc=()=>{const o=obra();const map={};itensObra(o.id).forEach(i=>{const k=i.desc.trim().toLowerCase();map[k]=map[k]||{desc:i.desc,tipo:i.tipo,un:i.un,qtd:0,v:0};map[k].qtd+=i.qtd;map[k].v+=i.qtd*i.preco});
 const arr=Object.values(map).sort((a,b)=>b.v-a.v);const tot=arr.reduce((s,x)=>s+x.v,0);let ac=0;arr.forEach(x=>{ac+=x.v;x.ac=tot?ac/tot*100:0;x.cl=x.ac-x.v/tot*100<80?'A':x.ac-x.v/tot*100<95?'B':'C'});
 const c=k=>arr.filter(x=>x.cl==k);const cv={A:'bad',B:'warn',C:'ok'};
 const W=600,H=180;const pts=arr.map((x,i)=>`${(i+1)/arr.length*W},${H-x.ac/100*H}`).join(' ');
 $('#view').innerHTML=`<div class="kpis">${['A','B','C'].map(k=>`<div class="kpi"><div class="l">Classe ${k} <span class="badge ${cv[k]}">${k=='A'?'até 80%':k=='B'?'80–95%':'95–100%'}</span></div><div class="v">${c(k).length} itens</div><div class="s">${brl(c(k).reduce((s,x)=>s+x.v,0))} · ${arr.length?pct(c(k).length/arr.length*100):''} dos itens</div></div>`).join('')}</div>
 ${arr.length?`<div class="card"><h3>Curva acumulada</h3><svg viewBox="-30 -10 ${W+40} ${H+30}" style="width:100%;max-height:240px"><line x1="0" x2="${W}" y1="${H-.8*H}" y2="${H-.8*H}" stroke="#dc2626" stroke-dasharray="4"/><line x1="0" x2="${W}" y1="${H-.95*H}" y2="${H-.95*H}" stroke="#d97706" stroke-dasharray="4"/><text x="-26" y="${H-.8*H+4}" font-size="10" fill="#dc2626">80%</text><text x="-26" y="${H-.95*H+4}" font-size="10" fill="#d97706">95%</text><polyline points="0,${H} ${pts}" fill="none" stroke="#2563eb" stroke-width="2.5"/><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#ccc"/></svg></div>`:''}
 <div class="card tw" style="padding:0">${arr.length?`<table><tr><th>#</th><th>Insumo / serviço</th><th>Tipo</th><th class="n">Qtd</th><th class="n">Valor</th><th class="n">% item</th><th class="n">% acum.</th><th>Classe</th></tr>${arr.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.desc)}</td><td>${x.tipo}</td><td class="n">${num(x.qtd)} ${esc(x.un)}</td><td class="n">${brl(x.v)}</td><td class="n">${pct(x.v/tot*100)}</td><td class="n">${pct(x.ac)}</td><td><span class="badge ${cv[x.cl]}">${x.cl}</span></td></tr>`).join('')}</table>`:'<div class="empty">Cadastre itens no orçamento para gerar a curva ABC.</div>'}</div>
 <p class="mut" style="font-size:12.5px">Dica: concentre a negociação de compras nos itens da classe A — são poucos itens que respondem por ~80% do custo.</p>`};

/* ---------- CRONOGRAMA ---------- */
V.cronograma=()=>{const o=obra();const et=etapasObra(o.id).filter(e=>e.inicio&&e.fim);
 if(!et.length){$('#view').innerHTML=`<div class="card empty">Defina início e fim nas etapas do orçamento para gerar o cronograma.<br><br><button class="btn p" onclick="go('orcamento')">Ir para Orçamento</button></div>`;return}
 const a=et.reduce((m,e)=>e.inicio<m?e.inicio:m,et[0].inicio),b=et.reduce((m,e)=>e.fim>m?e.fim:m,et[0].fim);const tot=Math.max(1,days(a,b));const P=d=>days(a,d)/tot*100;
 const months=[];let d=new Date(a+'T12:00');d.setDate(1);while(d.toISOString().slice(0,10)<=b){const s=d.toISOString().slice(0,10);if(s>=a||months.length==0)months.push(s<a?a:s);d.setMonth(d.getMonth()+1)}
 const t=today();const pf=progFisico(o.id);const pp=(()=>{const tt=et.reduce((s,e)=>s+custoEtapa(e.id),0);return tt?et.reduce((s,e)=>s+custoEtapa(e.id)*progPlanejado(e),0)/tt:et.reduce((s,e)=>s+progPlanejado(e),0)/et.length})();
 $('#view').innerHTML=`<div class="kpis"><div class="kpi"><div class="l">Avanço físico real</div><div class="v">${pct(pf)}</div></div><div class="kpi"><div class="l">Avanço planejado hoje</div><div class="v">${pct(pp)}</div></div><div class="kpi"><div class="l">Situação</div><div class="v ${pf+5<pp?'bad':'ok'}">${pf+5<pp?'Atrasada':'No prazo'}</div><div class="s">${pf+5<pp?'desvio de '+pct(pp-pf):''}</div></div><div class="kpi"><div class="l">Período</div><div class="v" style="font-size:16px">${fd(a)} → ${fd(b)}</div><div class="s">${tot} dias</div></div></div>
 <div class="card tw"><div style="min-width:640px"><div class="ghead"><div></div><div class="gmonths">${months.map(m=>`<span style="left:${P(m)}%">${new Date(m+'T12:00').toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})}</span>`).join('')}</div></div>
 ${et.map(e=>{const late=(+e.progresso||0)+5<progPlanejado(e);return `<div class="grow"><div style="font-size:13px;padding-right:8px"><b>${esc(e.nome)}</b><div class="mut" style="font-size:11.5px">${fd(e.inicio)}–${fd(e.fim)} · ${pct(+e.progresso||0)} ${late?'<span class="bad">· atrasada</span>':''}</div></div><div class="gtrack">${t>=a&&t<=b?`<div class="gtoday" style="left:${P(t)}%"></div>`:''}<div class="gbar" title="Clique para atualizar o avanço" onclick="crud('etapas',FE,S.etapas.find(x=>x.id=='${e.id}'),'etapa')" style="left:${P(e.inicio)}%;width:${Math.max(1,P(e.fim)-P(e.inicio))}%;${late?'outline:2px solid #dc2626':''}"><i style="width:${+e.progresso||0}%"></i></div></div></div>`}).join('')}</div>
 <div class="mut" style="font-size:12px;margin-top:10px">Barra cinza = duração planejada · laranja = avanço físico · linha vermelha = hoje. Clique numa barra para atualizar o avanço.</div></div>`};

/* ---------- RDO ---------- */
const CLIMA=['☀️ Ensolarado','⛅ Nublado','🌧️ Chuvoso','⛈️ Tempestade'];
let rdoFotos=[];
function rdoForm(r){rdoFotos=r?[...(r.fotos||[])]:[];const F=[{k:'data',l:'Data',t:'date',def:today(),req:1},{k:'condicao',l:'Condição do canteiro',t:'sel',opts:['Praticável','Impraticável parcial','Impraticável']},{k:'climaM',l:'Clima manhã',t:'sel',opts:CLIMA},{k:'climaT',l:'Clima tarde',t:'sel',opts:CLIMA},{k:'equipe',l:'Mão de obra (uma função por linha, ex.: "Pedreiro 4")',t:'area',full:1},{k:'equip',l:'Equipamentos em uso',t:'area',full:1},{k:'atividades',l:'Atividades executadas',t:'area',full:1,req:1},{k:'materiais',l:'Materiais recebidos / utilizados',t:'area',full:1},{k:'ocorrencias',l:'Ocorrências / observações',t:'area',full:1}];
 modal(r?'Editar RDO':'Novo Diário de Obra',form(F,r||{})+`<div class="f full" style="margin-top:12px"><label>Fotos</label><input type="file" accept="image/*" multiple onchange="addFotos(this.files)"><div class="thumbs" id="fth"></div></div>`,()=>{const d=readForm(F);if(!d)return false;d.fotos=rdoFotos;if(r)Object.assign(r,d);else S.rdos.push({id:uid(),obraId:CUR,...d});toast('RDO salvo')},'Salvar RDO',true);drawFth()}
function drawFth(){$('#fth').innerHTML=rdoFotos.map((f,i)=>`<div style="position:relative"><img src="${fotoSrc(f)}"><span onclick="rdoFotos.splice(${i},1);drawFth()" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center;cursor:pointer">✕</span></div>`).join('')}
function addFotos(files){[...files].forEach(f=>{const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);rdoFotos.push(c.toDataURL('image/jpeg',.65));drawFth()};im.src=e.target.result};rd.readAsDataURL(f)})}
const eqTotal=t=>(t||'').split('\n').reduce((s,l)=>s+(parseInt((l.match(/(\d+)\s*$/)||[])[1])||0),0);
function rdoTexto(r){const o=S.obras.find(x=>x.id==r.obraId);return `RELATÓRIO DIÁRIO DE OBRA — ${fd(r.data)}\nObra: ${o?.nome}\nCliente: ${o?.cliente}\nClima: manhã ${r.climaM} / tarde ${r.climaT} — Canteiro: ${r.condicao}\n\nMÃO DE OBRA (${eqTotal(r.equipe)} pessoas):\n${r.equipe||'—'}\n\nEQUIPAMENTOS:\n${r.equip||'—'}\n\nATIVIDADES:\n${r.atividades||'—'}\n\nMATERIAIS:\n${r.materiais||'—'}\n\nOCORRÊNCIAS:\n${r.ocorrencias||'—'}`}
function rdoVer(id){const r=S.rdos.find(x=>x.id==id);const sec=(t,v)=>`<h4 style="margin:14px 0 4px">${t}</h4><div style="white-space:pre-wrap">${esc(v||'—')}</div>`;
 modal('RDO — '+fd(r.data),`<div class="row"><span class="badge">${r.climaM}</span><span class="badge">${r.climaT}</span><span class="badge ${r.condicao=='Praticável'?'ok':'bad'}">${r.condicao}</span><span class="badge blue">${eqTotal(r.equipe)} pessoas</span></div>${sec('Mão de obra',r.equipe)}${sec('Equipamentos',r.equip)}${sec('Atividades executadas',r.atividades)}${sec('Materiais',r.materiais)}${sec('Ocorrências',r.ocorrencias)}${r.fotos?.length?`<h4 style="margin:14px 0 4px">Fotos</h4><div class="thumbs big">${r.fotos.map(f=>`<img src="${fotoSrc(f)}">`).join('')}</div>`:''}`,null,'',true);
 $('#mfoot').insertAdjacentHTML('afterbegin',`<button class="btn" onclick="copyTxt(rdoTexto(S.rdos.find(x=>x.id=='${id}')))">📋 Copiar relatório</button><button class="btn" onclick="closeM();rdoForm(S.rdos.find(x=>x.id=='${id}'))">Editar</button><button class="btn d" onclick="closeM();del('rdos','${id}')">Excluir</button><span class="sp"></span>`)}
function copyTxt(t){navigator.clipboard.writeText(t).then(()=>toast('Copiado!'),()=>toast('Não foi possível copiar'))}
V.rdo=()=>{const rs=S.rdos.filter(r=>r.obraId==CUR).sort((a,b)=>b.data.localeCompare(a.data));const hoje=rs.find(r=>r.data==today());
 $('#view').innerHTML=`<div class="row" style="margin-bottom:14px"><span class="mut">${rs.length} relatório(s) · ${rs.reduce((s,r)=>s+(r.fotos?.length||0),0)} foto(s)</span>${hoje?'<span class="badge ok">RDO de hoje preenchido</span>':'<span class="badge warn">RDO de hoje pendente</span>'}<span class="sp"></span><button class="btn p" onclick="rdoForm()">+ Novo RDO</button></div>
 ${rs.length?`<div class="rdo">${rs.map(r=>`<div class="rdoc" onclick="rdoVer('${r.id}')"><div class="row"><b style="font-size:15px">${fd(r.data)}</b><span class="sp"></span><span>${r.climaM.split(' ')[0]} ${r.climaT.split(' ')[0]}</span></div><div class="mut" style="font-size:12px;margin:4px 0 8px">${eqTotal(r.equipe)} pessoas · ${r.condicao}</div><div style="font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(r.atividades)}</div>${r.ocorrencias?`<div style="margin-top:6px"><span class="badge warn">ocorrência</span></div>`:''}${r.fotos?.length?`<div class="thumbs">${r.fotos.slice(0,4).map(f=>`<img src="${fotoSrc(f)}">`).join('')}</div>`:''}</div>`).join('')}</div>`:'<div class="card empty">Nenhum diário ainda. Registre clima, equipe, atividades e fotos do dia.</div>'}`};

/* ---------- MEDIÇÃO ---------- */
function medForm(m){const o=obra();const et=etapasObra(o.id);const k=1+(+o.bdi||0)/100;
